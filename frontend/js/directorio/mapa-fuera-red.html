<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de candidatos</title>
<!--
  Mapa de la vista "Mapa" de "Buscar fuera de la red" (Directorio de
  Proveedores). Lo abre js/pantallas/directorio-proveedores.js en un iframe y
  le manda por postMessage los candidatos de la búsqueda (DENUE o Google
  Maps).

  Es un archivo aparte de mapa-zona.html a propósito: aquél pinta el padrón
  del portal (proveedores con clave PRV-), y éste pinta CANDIDATOS que no son
  proveedores -- campos distintos (nombre/direccion/calificacion) y otro
  color de pin, para que no se confundan.

  Leaflet 1.9.4 desde unpkg con Subresource Integrity, igual que mapa-zona.
-->
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; height: 100%; background: var(--white); }
  #map { position: absolute; inset: 0; }
  #fallback {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    padding: 24px; text-align: left; font-size: 13px; line-height: 1.5; color: var(--text-secondary);
    background: var(--gray-bg);
  }
  .leaflet-container { background: var(--gray-bg); font-family: inherit; }
  .pin {
    background: var(--amber); color: var(--white); width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;
    border: 2px solid var(--white); box-shadow: var(--shadow-md);
  }
  /* Google Maps en azul, DENUE en ámbar: de un vistazo se ve de qué fuente
     salió cada pin cuando se comparan búsquedas. */
  .pin.google { background: var(--blue); }
  .leaflet-popup-content-wrapper { border-radius: var(--radius); box-shadow: var(--shadow-lg); }
  .leaflet-popup-content { margin: 12px 14px; font-size: 12.5px; line-height: 1.45; color: inherit; }
  .leaflet-popup-content b { font-size: 13px; color: var(--navy); }
  .leaflet-popup-content a { color: var(--blue); }
  .leaflet-bar { border-radius: var(--radius) !important; }
  .leaflet-bar a { color: var(--navy); }
  .leaflet-bar a:first-child { border-radius: var(--radius) var(--radius) 0 0 !important; }
  .leaflet-bar a:last-child { border-radius: 0 0 var(--radius) var(--radius) !important; }
</style>
</head>
<body>
<div id="map"></div>
<div id="fallback">No fue posible cargar el mapa base. Revisa la conexión y vuelve a abrir la vista de mapa.</div>
<script>
// Los textos del popup se meten como HTML: se escapan antes.
function escapar(valor) {
  if (valor === null || valor === undefined) return "";
  return String(valor)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

let map = null, layer = null, pending = null;

function boot() {
  if (typeof L === "undefined") { document.getElementById("fallback").style.display = "flex"; return; }
  map = L.map("map", { scrollWheelZoom: true, zoomControl: true }).setView([23.2, -100.5], 5);
  // Si el proveedor de teselas falla, se pasa al de respaldo.
  const providers = [
    { url: "https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", opts: { attribution: "Esri, HERE, Garmin, © OpenStreetMap", maxZoom: 16, maxNativeZoom: 16 } },
    { url: "https://{s}.tile.openstreetmap.de/{z}/{x}/{y}.png", opts: { subdomains: "abc", attribution: "© OpenStreetMap", maxZoom: 18 } }
  ];
  let pi = 0;
  function addTiles() {
    const p = providers[pi];
    const tl = L.tileLayer(p.url, Object.assign({}, p.opts)).addTo(map);
    let fails = 0;
    tl.on("tileerror", () => {
      fails++;
      if (fails > 2 && pi < providers.length - 1) { pi++; map.removeLayer(tl); addTiles(); }
      else if (fails > 2) { document.getElementById("fallback").style.display = "flex"; }
    });
  }
  addTiles();
  layer = L.layerGroup().addTo(map);
  if (pending) { render(pending); pending = null; }
  setTimeout(() => map.invalidateSize(), 250);
}

function coordenada(valor) {
  const n = typeof valor === "number" ? valor : parseFloat(valor);
  return Number.isFinite(n) ? n : null;
}

function popup(c) {
  const partes = ["<b>" + escapar(c.nombre || "Sin nombre registrado") + "</b>"];
  if (c.direccion) partes.push(escapar(c.direccion));
  if (c.calificacion != null) {
    partes.push("★ " + escapar(c.calificacion) + " (" + escapar(c.total_calificaciones || 0) + " reseñas)");
  }
  if (c.abierto_ahora === true) partes.push("Abierto ahora");
  else if (c.abierto_ahora === false) partes.push("Cerrado ahora");
  if (c.enlace_maps) {
    partes.push('<a href="' + escapar(c.enlace_maps) + '" target="_blank" rel="noopener noreferrer">Ver en Google Maps</a>');
  }
  return partes.join("<br>");
}

function render(payload) {
  if (!map) { pending = payload; return; }
  layer.clearLayers();
  const list = Array.isArray(payload.candidatos) ? payload.candidatos : [];
  const pts = [];
  let sinCoordenadas = 0;

  list.forEach((c, i) => {
    const lat = coordenada(c.latitud);
    const lng = coordenada(c.longitud);
    // Sin coordenadas no se dibuja: mejor un mapa con menos pines que uno
    // que los coloca donde no están.
    if (lat === null || lng === null) { sinCoordenadas++; return; }
    pts.push([lat, lng]);
    const esGoogle = c.origen === "fuera_de_red_google";
    L.marker([lat, lng], {
      icon: L.divIcon({ className: "", iconSize: [26, 26], html: '<div class="pin' + (esGoogle ? " google" : "") + '">' + (i + 1) + "</div>" })
    }).addTo(layer).bindPopup(popup(c));
  });

  const aviso = document.getElementById("fallback");
  if (!pts.length) {
    aviso.textContent = list.length
      ? "Ninguno de los " + list.length + " resultados de esta búsqueda trae coordenadas, así que no se pueden ubicar en el mapa."
      : "No hay resultados que mostrar en el mapa.";
    aviso.style.display = "flex";
  } else {
    aviso.style.display = "none";
    if (sinCoordenadas) {
      aviso.textContent = sinCoordenadas + " resultado(s) sin coordenadas no aparecen en el mapa.";
    }
  }

  map.invalidateSize();
  if (pts.length > 1) map.fitBounds(L.latLngBounds(pts).pad(0.4));
  else if (pts.length === 1) map.setView(pts[0], 14);
}

// Solo se aceptan mensajes del propio portal (mismo origen).
window.addEventListener("message", (e) => {
  if (e.origin !== location.origin) return;
  if (e.data && e.data.type === "candidatos") render(e.data);
});
window.addEventListener("resize", () => { if (map) map.invalidateSize(); });
window.addEventListener("load", () => {
  boot();
  if (window.parent !== window) window.parent.postMessage({ type: "mapa-listo" }, location.origin);
});
</script>
</body>
</html>
