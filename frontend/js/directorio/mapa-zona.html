<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de zona</title>
<!--
  Mapa de la vista "Mapa" del Directorio de Proveedores (maqueta, datos
  simulados). Lo abre js/pantallas/directorio-proveedores.js en un iframe y
  le manda por postMessage la lista de médicos de la zona.
  Leaflet 1.9.4 desde unpkg (igual que el prototipo original) con
  Subresource Integrity: si el archivo cambia en el CDN, el navegador no lo
  ejecuta y se muestra el aviso de respaldo. Las variables de color y la
  tipografía vienen de css/base.css del portal.
-->
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; height: 100%; background: var(--white); }
  #map { position: absolute; inset: 0; }
  #fallback {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    padding: 24px; text-align: left; font-size: 13px; line-height: 1.5; color: var(--text-secondary);
    background: var(--gray-bg);
  }
  .leaflet-container { background: var(--gray-bg); font-family: inherit; }
  .pin {
    background: var(--blue); color: var(--white); width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;
    border: 2px solid var(--white); box-shadow: var(--shadow-md);
  }
  .pin.places { background: var(--amber); }
  .leaflet-popup-content-wrapper { border-radius: var(--radius); box-shadow: var(--shadow-lg); }
  .leaflet-popup-content { margin: 12px 14px; font-size: 12.5px; line-height: 1.45; color: inherit; }
  .leaflet-popup-content b { font-size: 13px; color: var(--navy); }
  .leaflet-bar { border-radius: var(--radius) !important; }
  .leaflet-bar a { color: var(--navy); }
  .leaflet-bar a:first-child { border-radius: var(--radius) var(--radius) 0 0 !important; }
  .leaflet-bar a:last-child { border-radius: 0 0 var(--radius) var(--radius) !important; }
</style>
</head>
<body>
<div id="map"></div>
<div id="fallback">No fue posible cargar el mapa base. Revisa la conexión y vuelve a abrir la vista de mapa.</div>
<script>
// El mapa solo ubica a los proveedores que traen coordenadas REALES en el
// padrón (columnas Latitud/Longitud de la carga). Antes había aquí una tabla
// de coordenadas por municipio y los pines se dispersaban con un hash
// alrededor de ese punto: el mapa se veía lleno, pero ninguna posición
// correspondía al consultorio.

// Los textos del popup se meten como HTML: se escapan antes.
function escapar(valor) {
  if (valor === null || valor === undefined) return "";
  return String(valor)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

let map = null, layer = null, pending = null;

function boot() {
  if (typeof L === "undefined") { document.getElementById("fallback").style.display = "flex"; return; }
  map = L.map("map", { scrollWheelZoom: true, zoomControl: true }).setView([23.2, -100.5], 5);
  // Proveedores de teselas: si el primero falla, se pasa al de respaldo.
  const providers = [
    { url: "https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", opts: { attribution: "Esri, HERE, Garmin, © OpenStreetMap", maxZoom: 16, maxNativeZoom: 16 } },
    { url: "https://{s}.tile.openstreetmap.de/{z}/{x}/{y}.png", opts: { subdomains: "abc", attribution: "© OpenStreetMap", maxZoom: 18 } }
  ];
  let pi = 0;
  function addTiles() {
    const p = providers[pi];
    const tl = L.tileLayer(p.url, Object.assign({}, p.opts)).addTo(map);
    let fails = 0;
    tl.on("tileerror", () => {
      fails++;
      if (fails > 2 && pi < providers.length - 1) { pi++; map.removeLayer(tl); addTiles(); }
      else if (fails > 2) { document.getElementById("fallback").style.display = "flex"; }
    });
  }
  addTiles();
  layer = L.layerGroup().addTo(map);
  if (pending) { render(pending); pending = null; }
  setTimeout(() => map.invalidateSize(), 250);
}

function coordenada(valor) {
  const n = typeof valor === "number" ? valor : parseFloat(valor);
  return Number.isFinite(n) ? n : null;
}

function render(payload) {
  if (!map) { pending = payload; return; }
  layer.clearLayers();
  const list = Array.isArray(payload.doctors) ? payload.doctors : [];
  const pts = [];
  let sinCoordenadas = 0;

  list.forEach((d, i) => {
    const lat = coordenada(d.latitud);
    const lng = coordenada(d.longitud);
    // Sin coordenadas no se dibuja: es preferible un mapa con menos pines a
    // uno que los coloca donde no están.
    if (lat === null || lng === null) { sinCoordenadas++; return; }
    pts.push([lat, lng]);
    const fueraDeRed = d.origen === "portal";
    L.marker([lat, lng], {
      icon: L.divIcon({ className: "", iconSize: [26, 26], html: '<div class="pin' + (fueraDeRed ? " places" : "") + '">' + (i + 1) + "</div>" })
    }).addTo(layer).bindPopup(
      "<b>" + escapar(d.name) + "</b><br>" + escapar(d.specialty) + "<br>" + escapar(d.clinic) + "<br>" + escapar(d.price || "")
    );
  });

  const aviso = document.getElementById("fallback");
  if (!pts.length) {
    aviso.textContent = list.length
      ? "Ninguno de los " + list.length + " proveedores de esta búsqueda tiene coordenadas en el padrón, así que no se pueden ubicar en el mapa."
      : "No hay proveedores que mostrar en el mapa.";
    aviso.style.display = "flex";
  } else {
    aviso.style.display = "none";
    if (sinCoordenadas) {
      aviso.textContent = sinCoordenadas + " proveedor(es) sin coordenadas en el padrón no aparecen en el mapa.";
    }
  }

  map.invalidateSize();
  if (pts.length > 1) map.fitBounds(L.latLngBounds(pts).pad(0.4));
  else if (pts.length === 1) map.setView(pts[0], 14);
}

// Solo se aceptan mensajes del propio portal (mismo origen).
window.addEventListener("message", (e) => {
  if (e.origin !== location.origin) return;
  if (e.data && e.data.type === "zona") render(e.data);
});
window.addEventListener("resize", () => { if (map) map.invalidateSize(); });
window.addEventListener("load", () => {
  boot();
  if (window.parent !== window) window.parent.postMessage({ type: "mapa-listo" }, location.origin);
});
</script>
</body>
</html>
