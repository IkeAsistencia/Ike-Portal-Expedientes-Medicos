<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Expedientes Médicos</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/componentes.css">
</head>
<body>
<!--
  Marco del portal. El contenido de cada pantalla NO vive aquí: lo pinta su
  propio módulo en js/pantallas/ (ver js/app.js). Este archivo solo tiene
  el contenedor del login, el menú lateral y la barra superior.
-->

<!-- ======================= LOGIN (lo llena js/pantallas/login.js) ======================= -->
<div id="view-login"></div>

<!-- ======================= APP ======================= -->
<div id="view-app" class="hidden">
  <div class="sidebar">
    <div class="sidebar-brand">
      <img src="img/logo-ike-blanco.png" alt="IKE" class="sidebar-logo">
      Expedientes Médicos<small>Panel de gestión</small>
    </div>
    <div class="nav-item" data-pantalla="expedientes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4"/><path d="M9 3v6h6"/><path d="M9 3l11 11"/></svg>
      Expedientes
    </div>
    <div class="nav-item" data-pantalla="pago-anticipado">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
      Expedientes PA
    </div>
    <div class="nav-item" data-pantalla="seguimiento">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      Seguimiento de expedientes
    </div>
    <div class="nav-item" data-pantalla="configuracion">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06A2 2 0 1 1 7.04 4.29l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Configuración Cuentas
    </div>
    <div class="nav-item" data-pantalla="accesos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Usuarios y Accesos
    </div>
    <div class="nav-spacer"></div>
    <div class="nav-user" id="nav-user"></div>
    <div class="nav-item" id="nav-salir">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      Salir
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <h1 id="topbar-title">Expedientes</h1>
      <div class="crumbs" id="topbar-crumbs">Inicio &nbsp;›&nbsp; <b>Expedientes</b></div>
    </div>

    <!-- Aquí app.js monta una <div class="screen"> por cada pantalla. -->
    <div class="content" id="contenido"></div>
  </div>
</div>

<div id="toast-container"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
